# NCA Essential Cybersecurity Controls ECC-2:2024 (Document classification: Public,
# TLP: White). Generated by tools/extract_catalog.py, then reviewed by hand.
framework: ECC-2:2024
source: https://cdn.nca.gov.sa/api/files/public/upload/86e09090-44e4-481f-bc28-355673607654_ECC--2024-EN.pdf
domains:
- id: 1
  title: Cybersecurity Governance
  subdomains:
  - id: 1-1
    title: Cybersecurity Strategy
    controls:
    - id: 1-1-1
      text: The cybersecurity strategy of the entity shall be identified, documented, and
        approved, and it shall be supported by the head of the entity or his/her delegate
        (Hereinafter referred to as the “Authorized Official”). The strategy goals shall be
        in line with the relevant legislative and regulatory requirements.
    - id: 1-1-2
      text: The entity shall execute an action plan to apply the cybersecurity strategy.
    - id: 1-1-3
      text: The cybersecurity strategy shall be reviewed at planned intervals (or in case
        of changes to the relevant legislative and regulatory requirements).
  - id: 1-2
    title: Cybersecurity Management
    controls:
    - id: 1-2-1
      text: A department for cybersecurity shall be established within the entity. This department
        shall be independent from the Information Technology and Communications Department
        (As per High Order No. 37140, dated 14/08/1438H.). It is recommended that the Cybersecurity
        Department reports directly to the head of the entity or his/her delegate while ensuring
        that this does not result in a conflict of interests.
    - id: 1-2-2
      text: All cybersecurity positions shall be filled out with full-time and qualified Saudi
        cybersecurity professionals.
    - id: 1-2-3
      text: A cybersecurity supervisory committee shall be established pursuant to the instruction
        of the entity’s Authorized Official to ensure compliance with, support for, and monitoring
        of the implementation of the cybersecurity programs and regulations. The committee’s
        members, responsibilities, and governance framework shall be identified, documented,
        and approved. The committee shall include the head of the cybersecurity department
        as a member. It is recommended that the committee reports directly to the head of
        the entity or his/her delegate while ensuring that this does not result in a conflict
        of interests.
  - id: 1-3
    title: Cybersecurity Policies and Procedures
    controls:
    - id: 1-3-1
      text: The cybersecurity department of the entity shall identify and document cybersecurity
        policies and procedures, including the cybersecurity controls and requirements, and
        have them approved by the entity’s Authorized Official, and communicate them to the
        relevant personnel and parties inside the entity.
    - id: 1-3-2
      text: The cybersecurity department shall ensure that the cybersecurity policies and
        procedures, including the relevant controls and requirements, are implemented at the
        entity.
    - id: 1-3-3
      text: The cybersecurity policies and procedures shall be supported by technical security
        standards (e.g. technical security standards for firewall, databases, operating systems,
        etc.).
    - id: 1-3-4
      text: The cybersecurity policies and procedures shall be reviewed and updated at planned
        intervals (or in case of changes to the relevant legislative and regulatory requirements
        and standards). Changes shall be documented and approved.
  - id: 1-4
    title: Cybersecurity Roles and Responsibilities
    controls:
    - id: 1-4-1
      text: The Authorized Official shall identify, document, and approve the governance organizational
        structure, roles, and responsibilities of the entity’s cybersecurity, and assign the
        persons concerned therewith. The necessary support shall be provided for the implementation
        thereof while ensuring that this does not result in a conflict of interests.
    - id: 1-4-2
      text: The cybersecurity roles and responsibilities within the entity shall be reviewed
        and updated at planned intervals (or in case of changes to the relevant legislative
        and regulatory requirements).
  - id: 1-5
    title: Cybersecurity Risk Management
    controls:
    - id: 1-5-1
      text: The cybersecurity department of the entity shall identify, document, and approve
        the cybersecurity risk management methodology and procedures within the entity, in
        accordance with considerations of confidentiality, and the integrity and availability
        of information and technology assets.
    - id: 1-5-2
      text: The cybersecurity department shall implement the cybersecurity risk management
        methodology and procedures within the entity.
    - id: 1-5-3
      text: 'The cybersecurity risk assessment procedures shall be implemented at least in
        the following cases:'
      subcontrols:
      - id: 1.5.3.1
        text: At early stage of technology projects.
      - id: 1.5.3.2
        text: Before making major changes to technology infrastructure.
      - id: 1.5.3.3
        text: During planning to obtain third party services.
      - id: 1.5.3.4
        text: During planning and before the release of new technology services and products.
    - id: 1-5-4
      text: The cybersecurity risk management methodology and procedures shall be reviewed
        and updated at planned intervals (or in case of changes to the relevant legislative
        and regulatory requirements and standards). Changes shall be documented and approved.
  - id: 1-6
    title: Cybersecurity in Information and Technology Project Management
    controls:
    - id: 1-6-1
      text: Cybersecurity requirements shall be included in the project management methodology
        and procedures and in the information and technology asset change management within
        the entity to ensure identifying and managing cybersecurity risks as part of the technology
        project lifecycle. The cybersecurity requirements shall be a key part of the requirements
        for technology projects.
    - id: 1-6-2
      text: 'The cybersecurity requirements for project management and information and technology
        asset changes within the entity shall include the following as a minimum:'
      subcontrols:
      - id: 1.6.2.1
        text: Vulnerability assessment and remediation.
      - id: 1.6.2.2
        text: Reviewing secure configuration and hardening and updates packages before launching
          projects and changes.
    - id: 1-6-3
      text: 'The cybersecurity requirements for software and application development projects
        within the entity shall include the following as a minimum:'
      subcontrols:
      - id: 1.6.3.1
        text: Using the secure coding standards.
      - id: 1.6.3.2
        text: Using trusted and licensed sources for software development tools and libraries.
      - id: 1.6.3.3
        text: Conducting compliance test for software against the cybersecurity requirements
          within the entity.
      - id: 1.6.3.4
        text: Secure integration between applications.
      - id: 1.6.3.5
        text: Reviewing secure configuration and hardening and updates packages before launching
          software products
    - id: 1-6-4
      text: The cybersecurity requirements for project management within the entity shall
        be periodically reviewed.
  - id: 1-7
    title: Compliance with Cybersecurity Standards, Laws and Regulations
    controls:
    - id: 1-7-1
      text: If there are nationally approved international agreements or commitments that
        include cybersecurity requirements, the entity shall identify and comply with these
        requirements.
  - id: 1-8
    title: Periodical Cybersecurity Review and Audit
    controls:
    - id: 1-8-1
      text: The cybersecurity department of the entity shall periodically review the implementation
        of cybersecurity controls by the entity.
    - id: 1-8-2
      text: The implementation of cybersecurity controls by the entity shall be reviewed and
        audited by parties other than the cybersecurity department at the entity, provided
        that the audit and review are to be conducted independently while considering the
        principle of conflict of interest, as per the Generally Accepted Auditing Standards
        (GAAS) and the relevant legislative and regulatory requirements.
    - id: 1-8-3
      text: The results of cybersecurity audits and reviews shall be documented and presented
        to the cybersecurity supervisory committee and the Authorized Official. Results shall
        include the audit and review scope, observations, recommendations, corrective actions,
        and remediation plans.
  - id: 1-9
    title: Cybersecurity in Human Resources
    controls:
    - id: 1-9-1
      text: Cybersecurity requirements for personnel of the entity shall be identified, documented,
        and approved prior to, during, and upon the end or termination of their employment.
    - id: 1-9-2
      text: Cybersecurity requirements for personnel of the entity shall be implemented.
    - id: 1-9-3
      text: 'Cybersecurity requirements prior to the commencement of the employment relationship
        between personnel and the entity shall include the following as a minimum:'
      subcontrols:
      - id: 1.9.3.1
        text: Incorporating the personnel’s cybersecurity responsibilities clauses and non-disclosure
          clauses in their employment contracts with the entity (including during and after
          employment end/termination with the entity).
      - id: 1.9.3.2
        text: Conducting screening or vetting for personnel in cybersecurity positions and
          technical positions with critical and privileged powers.
    - id: 1-9-4
      text: 'Cybersecurity requirements for personnel during their employment relationship
        with the entity shall include the following as a minimum:'
      subcontrols:
      - id: 1.9.4.1
        text: Cybersecurity awareness (during on-boarding and during employment).
      - id: 1.9.4.2
        text: Implementation and compliance with cybersecurity requirements, as per the entity’s
          cybersecurity policies, procedures, and operations.
    - id: 1-9-5
      text: The personnel’s powers shall be reviewed and revoked immediately upon the end/termination
        of their employment with the entity.
    - id: 1-9-6
      text: Cybersecurity requirements for personnel of the entity shall be periodically reviewed.
  - id: 1-10
    title: Cybersecurity Awareness and Training Program
    controls:
    - id: 1-10-1
      text: A cybersecurity awareness program, delivered through multiple channels, shall
        be periodically developed and approved by the entity to strengthen the awareness about
        cybersecurity, cyber threats, and risks, and to build a positive cybersecurity awareness
        culture.
    - id: 1-10-2
      text: The approved cybersecurity awareness program shall be implemented within the entity.
    - id: 1-10-3
      text: 'The cybersecurity awareness program shall include how to protect the entity against
        the most important and latest cyber risks and threats, including:'
      subcontrols:
      - id: 1.10.3.1
        text: Secure handling of email services, especially phishing emails.
      - id: 1.10.3.2
        text: Secure handling of mobile devices and storage media.
      - id: 1.10.3.3
        text: Secure Internet browsing.
      - id: 1.10.3.4
        text: Secure usage of social media.
    - id: 1-10-4
      text: 'Specialized skills and necessary training shall be provided to personnel in positions
        that are linked directly to cybersecurity within the entity. Such skills and training
        shall be classified in line with their cybersecurity responsibilities, including:'
      subcontrols:
      - id: 1.10.4.1
        text: Cybersecurity department personnel.
      - id: 1.10.4.2
        text: Personnel working on software/application development and those working on information
          and technology assets of the entity.
      - id: 1.10.4.3
        text: Executive and supervisory positions.
    - id: 1-10-5
      text: The implementation of cybersecurity awareness program within the entity shall
        be periodically reviewed.
- id: 2
  title: Cybersecurity Defense
  subdomains:
  - id: 2-1
    title: Asset Management
    controls:
    - id: 2-1-1
      text: Cybersecurity requirements for managing information and technology assets of the
        entity shall be identified, documented, and approved.
    - id: 2-1-2
      text: Cybersecurity requirements for managing information and technology assets of the
        entity shall be implemented.
    - id: 2-1-3
      text: The policy of acceptable use of information and technology assets of the entity
        shall be identified, documented, approved, and communicated.
    - id: 2-1-4
      text: The policy of acceptable use of information and technology assets of the entity
        shall be implemented.
    - id: 2-1-5
      text: Information and technology assets of the entity shall be classified, labeled,
        and handled as per the relevant legislative and regulatory requirements.
    - id: 2-1-6
      text: Cybersecurity requirements for managing information and technology assets of the
        entity shall be periodically reviewed.
  - id: 2-2
    title: Identity and Access Management
    controls:
    - id: 2-2-1
      text: Cybersecurity requirements for identity and access management of the entity shall
        be identified, documented, and approved.
    - id: 2-2-2
      text: Cybersecurity requirements for identity and access management of the entity shall
        be implemented.
    - id: 2-2-3
      text: 'Cybersecurity requirements for identity and access management of the entity shall
        include the following as a minimum:'
      subcontrols:
      - id: 2.2.3.1
        text: Single-factor authentication based on username and password.
      - id: 2.2.3.2
        text: Multi-factor authentication, and defining the suitable authentication factors
          and their numbers as well as the suitable authentication techniques based on the
          result of impact assessment of authentication failure and bypass for remote access
          and for privileged accounts.
      - id: 2.2.3.3
        text: User authorization based on identity and access control principles (Need-to-Know
          and Need-to-Use principle, Least Privilege principle, and Segregation of Duties
          principle).
      - id: 2.2.3.4
        text: Privileged access management.
      - id: 2.2.3.5
        text: Periodic review of identities and access rights.
    - id: 2-2-4
      text: The implementation of cybersecurity requirements for identity and access management
        of the entity shall be periodically reviewed.
  - id: 2-3
    title: Information System and Processing Facilities Protection
    controls:
    - id: 2-3-1
      text: Cybersecurity requirements for protection of information system and processing
        facilities of the entity shall be identified, documented, and approved.
    - id: 2-3-2
      text: Cybersecurity requirements for protection of information systems and processing
        facilities of the entity shall be implemented.
    - id: 2-3-3
      text: 'Cybersecurity requirements for protection of information systems and processing
        facilities of the entity shall include the following as a minimum:'
      subcontrols:
      - id: 2.3.3.1
        text: Protection from viruses, suspicious programs and activities, and malware on
          workstations and servers, using modern and advanced protection technologies and
          mechanisms, and securely managing them.
      - id: 2.3.3.2
        text: Strict restriction on the use of external storage media and their security.
      - id: 2.3.3.3
        text: Patch management for systems, applications, and devices.
      - id: 2.3.3.4
        text: Centralized clock synchronization with an accurate and trusted source, such
          as sources provided by the Saudi Standards, Metrology and Quality Organization (SASO).
    - id: 2-3-4
      text: The implementation of cybersecurity requirements for protection of the information
        system and processing facilities of the entity shall be periodically reviewed.
  - id: 2-4
    title: Email Protection
    controls:
    - id: 2-4-1
      text: Cybersecurity requirements for protection of the email service of the entity shall
        be identified, documented, and approved.
    - id: 2-4-2
      text: Cybersecurity requirements for protection of email service of the entity shall
        be implemented.
    - id: 2-4-3
      text: 'Cybersecurity requirements for protection of the email service of the entity
        shall include the following as a minimum:'
      subcontrols:
      - id: 2.4.3.1
        text: Analyzing and filtering email messages (specifically phishing emails and spam
          emails) using modern and advanced email protection techniques and mechanisms.
      - id: 2.4.3.2
        text: Multi-factor authentication, and defining the suitable authentication factors
          and their numbers as well as the suitable authentication techniques based on the
          result of impact assessment of authentication failure and bypass for remote and
          webmail access.
      - id: 2.4.3.3
        text: Email archiving and backup.
      - id: 2.4.3.4
        text: Secure management and protection against Advanced Persistent Threats (APT),
          which normally utilize zero-day malware and viruses.
      - id: 2.4.3.5
        text: Validation of the entity’s email service domains by using Sender Policy Framework
          (SPF), Domain Keys Identified Mail (DKIM), and Domain Message Authentication Reporting
          and Conformance (DMARC).
    - id: 2-4-4
      text: The implementation of cybersecurity requirements for email service of the entity
        shall be periodically reviewed.
  - id: 2-5
    title: Networks Security Management
    controls:
    - id: 2-5-1
      text: Cybersecurity requirements for the entity’s network security management shall
        be identified, documented, and approved.
    - id: 2-5-2
      text: Cybersecurity requirements for the entity’s network security management shall
        be implemented.
    - id: 2-5-3
      text: 'Cybersecurity requirements for the entity’s network security management shall
        include the following as a minimum:'
      subcontrols:
      - id: 2.5.3.1
        text: Logical or physical isolation and segmentation of network segments in a secure
          manner which is required to control relevant cybersecurity risks, using firewall
          and defense-in-depth principle.
      - id: 2.5.3.2
        text: Isolation of production network from testing and development environment networks.
      - id: 2.5.3.3
        text: Secure browsing and internet connectivity, including strict restrictions on
          suspicious websites, file storage/sharing websites, and remote access websites.
      - id: 2.5.3.4
        text: Wireless network security and protection using secure authentication and encryption
          techniques and avoiding the connection of wireless networks to the entity’s internal
          network, except after a comprehensive assessment of subsequent risks, with handling
          them in a way that protects the technology assets of the entity.
      - id: 2.5.3.5
        text: Restricting and managing network services, protocols, and ports.
      - id: 2.5.3.6
        text: Intrusion Prevention Systems (IPS).
      - id: 2.5.3.7
        text: Security of Domain Name Service (DNS).
      - id: 2.5.3.8
        text: Secure management and protection of Internet browsing channel against Advanced
          Persistent Threats (APT), which normally utilize zero-day malware and viruses.
      - id: 2.5.3.9
        text: Protecting against Distributed Denial of Service (DDoS) attacks to limit risks
          arising from these attacks.
    - id: 2-5-4
      text: The implementation of cybersecurity requirements for the entity’s network security
        management shall be periodically reviewed.
  - id: 2-6
    title: Mobile Devices Security
    controls:
    - id: 2-6-1
      text: Cybersecurity requirements for mobile devices and BYOD security when connected
        to the entity’s network shall be identified, documented, and approved.
    - id: 2-6-2
      text: Cybersecurity requirements for mobile devices and BYOD security of the entity
        shall be implemented.
    - id: 2-6-3
      text: 'Cybersecurity requirements for mobile devices and BYOD security of the entity
        shall include the following as a minimum:'
      subcontrols:
      - id: 2.6.3.1
        text: Separation and encryption of the entity’s data and information stored on mobile
          devices and BYODs.
      - id: 2.6.3.2
        text: Controlled and restricted use based on the requirements of the interest of the
          entity's business.
      - id: 2.6.3.3
        text: Deletion of the entity’s data and information stored on mobile devices and BYOD
          in cases of device loss or after the ending/termination of employment with the entity.
      - id: 2.6.3.4
        text: Security awareness for users.
    - id: 2-6-4
      text: The implementation of cybersecurity requirements for mobile devices and BYOD security
        of the entity shall be periodically reviewed.
  - id: 2-7
    title: Data and Information Protection
    controls:
    - id: 2-7-1
      text: Cybersecurity requirements for protecting and handling data and information of
        the entity shall be identified, documented, and approved, as per the relevant legislative
        and regulatory requirements.
    - id: 2-7-2
      text: Cybersecurity requirements for protecting data and information of the entity shall
        be implemented, based on its classification level.
    - id: 2-7-3
      text: The implementation of cybersecurity requirements for protecting data and information
        of the entity shall be periodically reviewed.
  - id: 2-8
    title: Cryptography
    controls:
    - id: 2-8-1
      text: Cybersecurity requirements for cryptography within the entity shall be identified,
        documented, and approved.
    - id: 2-8-2
      text: Cybersecurity requirements for cryptography within the entity shall be implemented.
    - id: 2-8-3
      text: 'Cybersecurity requirements for cryptography shall include at least the requirements
        in the National Cryptographic Standards, published by NCA. The appropriate cryptographic
        standard level shall be implemented based on the nature and sensitivity of the data,
        systems, and networks to be protected as well as the entity’s risk assessment, and
        as per the relevant legislative and regulatory requirements, as follows:'
      subcontrols:
      - id: 2.8.3.1
        text: Approved cryptographic systems and solutions standards and their technical and
          regulatory restrictions.
      - id: 2.8.3.2
        text: Secure management of cryptographic keys during their lifecycles.
      - id: 2.8.3.3
        text: Encryption of data in-transit and at-rest, as per their classification and the
          relevant legislative and regulatory requirements.
    - id: 2-8-4
      text: The implementation of cybersecurity requirements for cryptography within the entity
        shall be periodically reviewed.
  - id: 2-9
    title: Backup and Recovery Management
    controls:
    - id: 2-9-1
      text: Cybersecurity requirements for backup and recovery management within the entity
        shall be identified, documented, and approved.
    - id: 2-9-2
      text: Cybersecurity requirements for backup and recovery management within the entity
        shall be implemented.
    - id: 2-9-3
      text: 'Cybersecurity requirements for backup and recovery management shall include the
        following as a minimum:'
      subcontrols:
      - id: 2.9.3.1
        text: Scope of backups to cover critical technology and information assets.
      - id: 2.9.3.2
        text: Ability to perform quick recovery of data and systems after cybersecurity incidents.
      - id: 2.9.3.3
        text: Periodic testing for the effectiveness of backup recovery.
    - id: 2-9-4
      text: The implementation of cybersecurity requirements for backup and recovery management
        within the entity shall be periodically reviewed.
  - id: 2-10
    title: Vulnerabilities Management
    controls:
    - id: 2-10-1
      text: Cybersecurity requirements for technical vulnerabilities management within the
        entity shall be identified, documented, and approved.
    - id: 2-10-2
      text: Cybersecurity requirements for technical vulnerabilities management within the
        entity shall be implemented.
    - id: 2-10-3
      text: 'Cybersecurity requirements for technical vulnerabilities management shall include
        the following as a minimum:'
      subcontrols:
      - id: 2.10.3.1
        text: Periodic vulnerabilities assessment and detection.
      - id: 2.10.3.2
        text: Vulnerabilities classification based on their severities.
      - id: 2.10.3.3
        text: Vulnerabilities remediation based on their classification and the associated
          cyber risks.
      - id: 2.10.3.4
        text: Patch management to remediate vulnerabilities, and ensuring the integrity and
          effectiveness of these updates and fixes are verified using a non-production environment
          before being applied.
      - id: 2.10.3.5
        text: Communication and subscription with trusted resources for new and up-to-date
          vulnerabilities.
    - id: 2-10-4
      text: The implementation of cybersecurity requirements for technical vulnerabilities
        management within the entity shall be periodically reviewed.
  - id: 2-11
    title: Penetration Testing
    controls:
    - id: 2-11-1
      text: Cybersecurity requirements for penetration testing within the entity shall be
        identified, documented, and approved.
    - id: 2-11-2
      text: Cybersecurity requirements for penetration testing within the entity shall be
        implemented.
    - id: 2-11-3
      text: 'Cybersecurity requirements for penetration testing shall include the following
        as a minimum:'
      subcontrols:
      - id: 2.11.3.1
        text: Scope of penetration testing to include all externally provided services (via
          the Internet) and their technical components, including infrastructure, websites,
          web applications, smartphone and tablet applications, email, and remote access.
      - id: 2.11.3.2
        text: Conducting penetration tests periodically.
    - id: 2-11-4
      text: The implementation of cybersecurity requirements for penetration testing shall
        be periodically reviewed.
  - id: 2-12
    title: Cybersecurity Event Logs and Monitoring Management
    controls:
    - id: 2-12-1
      text: Cybersecurity requirements for cybersecurity event logs and monitoring management
        within the entity shall be identified, documented, and approved.
    - id: 2-12-2
      text: Cybersecurity requirements for cybersecurity event logs and monitoring management
        within the entity shall be implemented.
    - id: 2-12-3
      text: 'Cybersecurity requirements for cybersecurity event logs and monitoring management
        shall include the following as a minimum:'
      subcontrols:
      - id: 2.12.3.1
        text: Activation of cybersecurity event logs for critical information assets within
          the entity.
      - id: 2.12.3.2
        text: Activation of cybersecurity event logs for critical and privileged accounts
          accessing information assets as well as for remote access events within the entity.
      - id: 2.12.3.3
        text: Identification of Security Information and Event Management (SIEM) techniques
          required for cybersecurity event logs collection.
      - id: 2.12.3.4
        text: Continuous monitoring of cybersecurity event logs.
      - id: 2.12.3.5
        text: Retention period of cybersecurity event logs (shall be at least 12 months).
    - id: 2-12-4
      text: The implementation of cybersecurity requirements for cybersecurity event logs
        and monitoring management within the entity shall be periodically reviewed.
  - id: 2-13
    title: Cybersecurity Incident and Threat Management
    controls:
    - id: 2-13-1
      text: Requirements for cybersecurity incident and threat management within the entity
        shall be identified, documented, and approved.
    - id: 2-13-2
      text: Requirements for cybersecurity incident and threat management within the entity
        shall be implemented.
    - id: 2-13-3
      text: 'Requirements for cybersecurity incident and threat management shall include the
        following as a minimum:'
      subcontrols:
      - id: 2.13.3.1
        text: Cybersecurity incident response plans and escalation procedures.
      - id: 2.13.3.2
        text: Cybersecurity incident classification.
      - id: 2.13.3.3
        text: Reporting cybersecurity incidents to the NCA.
      - id: 2.13.3.4
        text: Sharing cybersecurity incident notifications, threat intelligence, penetration
          indicators, and incident reports with the NCA.
      - id: 2.13.3.5
        text: Collecting and handling threat intelligence feeds.
    - id: 2-13-4
      text: The implementation of cybersecurity requirements for incident and threat management
        within the entity shall be periodically reviewed.
  - id: 2-14
    title: Physical Security
    controls:
    - id: 2-14-1
      text: Cybersecurity requirements for protection of information and technology assets
        of the entity against unauthorized physical access, loss, theft, and damage shall
        be identified, documented, and approved.
    - id: 2-14-2
      text: Cybersecurity requirements for protection of information and technology assets
        of the entity against unauthorized physical access, loss, theft, and damage shall
        be implemented.
    - id: 2-14-3
      text: 'Cybersecurity requirements for protection of information and technology assets
        of the entity against unauthorized physical access, loss, theft, and damage shall
        include the following as a minimum:'
      subcontrols:
      - id: 2.14.3.1
        text: Authorized access to critical areas within the entity (e.g. the entity’s data
          center, disaster recovery center, critical information processing facilities, security
          surveillance center, network connection rooms, technical device and equipment supply
          areas, etc.).
      - id: 2.14.3.2
        text: Access and monitoring logs (CCTV).
      - id: 2.14.3.3
        text: Protection of access and monitoring log information.
      - id: 2.14.3.4
        text: Security of the destruction and re-use of physical assets that hold classified
          information (including paper documents and storage media).
      - id: 2.14.3.5
        text: Security of devices and equipment inside and outside the entity’s facilities.
    - id: 2-14-4
      text: Cybersecurity requirements for protection of information and technology assets
        of the entity against unauthorized physical access, loss, theft, and damage shall
        be periodically reviewed.
  - id: 2-15
    title: Web Application Security
    controls:
    - id: 2-15-1
      text: Cybersecurity requirements for protection of external web applications of the
        entity shall be identified, documented, and approved.
    - id: 2-15-2
      text: Cybersecurity requirements for protection of external web applications of the
        entity shall be implemented.
    - id: 2-15-3
      text: 'Cybersecurity requirements for protection of external web applications of the
        entity shall include the following as a minimum:'
      subcontrols:
      - id: 2.15.3.1
        text: Use of web application firewall.
      - id: 2.15.3.2
        text: Adoption of the multi-tier architecture principle.
      - id: 2.15.3.3
        text: Use of secure protocols (e.g. HTTPS).
      - id: 2.15.3.4
        text: Clarification of the secure usage policy for users.
      - id: 2.15.3.5
        text: User authentication, and the suitable authentication factors and their numbers
          as well as the authentication techniques shall be defined based on the result of
          impact assessment of authentication failure and bypass for users’ access.
    - id: 2-15-4
      text: Cybersecurity requirements for protection of web applications of the entity shall
        be periodically reviewed.
- id: 3
  title: Cybersecurity Resilience
  subdomains:
  - id: 3-1
    title: Cybersecurity Resilience Aspects of Business Continuity Management (BCM)
    controls:
    - id: 3-1-1
      text: Cybersecurity requirements for business continuity management within the entity
        shall be identified, documented, and approved.
    - id: 3-1-2
      text: Cybersecurity requirements for business continuity management within the entity
        shall be implemented.
    - id: 3-1-3
      text: 'Cybersecurity requirements for business continuity management within the entity
        shall include the following as a minimum:'
      subcontrols:
      - id: 3.1.3.1
        text: Ensuring the continuity of cybersecurity systems and procedures.
      - id: 3.1.3.2
        text: Developing plans for response to cybersecurity incidents that may affect the
          entity’s business continuity.
      - id: 3.1.3.3
        text: Developing disaster recovery plans.
    - id: 3-1-4
      text: Cybersecurity requirements for business continuity management within the entity
        shall be periodically reviewed.
- id: 4
  title: Third-Party and Cloud Computing Cybersecurity
  subdomains:
  - id: 4-1
    title: Third-Party Cybersecurity
    controls:
    - id: 4-1-1
      text: Cybersecurity requirements for the entity’s contracts and agreements with third
        parties shall be identified, documented, and approved.
    - id: 4-1-2
      text: 'Cybersecurity requirements for contracts and agreements with third parties, e.g.
        Service Level Agreement (SLA), which, if impaired, may affect the entity''s data or
        services shall include the following as a minimum:'
      subcontrols:
      - id: 4.1.2.1
        text: Clauses of non-disclosure and the secure removal of the entity’s data by the
          third party upon the end of service.
      - id: 4.1.2.2
        text: Communication procedures in case of the occurrence of a cybersecurity incident.
      - id: 4.1.2.3
        text: Obligating the third party to apply the entity’s cybersecurity requirements
          and policies and the relevant legislative and regulatory requirements.
    - id: 4-1-3
      text: 'Cybersecurity requirements for contracts and agreements with third parties providing
        IT or cybersecurity outsourcing or managed services shall include the following as
        a minimum:'
      subcontrols:
      - id: 4.1.3.1
        text: Conducting a cybersecurity risk assessment and ensuring the availability of
          risk mitigation controls before signing contracts and agreements or upon making
          changes to the relevant legislative and regulatory requirements.
      - id: 4.1.3.2
        text: Cybersecurity managed service centers for monitoring and operations which use
          remote access shall be fully located in the Kingdom of Saudi Arabia.
    - id: 4-1-4
      text: Cybersecurity requirements for third parties shall be periodically reviewed.
  - id: 4-2
    title: Cloud Computing and Hosting Cybersecurity
    controls:
    - id: 4-2-1
      text: Cybersecurity requirements for use of cloud computing and hosting services shall
        be identified, documented, and approved.
    - id: 4-2-2
      text: Cybersecurity requirements for the cloud computing and hosting services within
        the entity shall be implemented.
    - id: 4-2-3
      text: 'In accordance with the relevant legislative and regulatory requirements, and
        in addition to the applicable controls in the Main Domains (1), (2), and (3) and Subdomain
        (4.1) that are necessary to protect the entity’s data or services provided thereto,
        cybersecurity requirements for use of cloud computing and hosting services shall include
        the following as a minimum:'
      subcontrols:
      - id: 4.2.3.1
        text: Protection of entity's data by cloud and hosting service providers in accordance
          with its classification level and returning data (in a usable format) upon service
          completion.
      - id: 4.2.3.2
        text: Separation of the entity’s environment (especially virtual servers) from environments
          of other entities within the cloud computing service provider.
    - id: 4-2-4
      text: Cybersecurity requirements for cloud computing and hosting services shall be periodically
        reviewed.
